<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Friday</title>
  <meta name="theme-color" content="#05090d" />
  <meta name="description" content="Friday——你的個人 AI 生活總管" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Friday" />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <div class="app" id="app" data-state="idle">
    <!-- 標題列 -->
    <header class="topbar">
      <div class="brand">
        <div class="hud-core" aria-hidden="true">
          <svg viewBox="0 0 40 40">
            <circle class="hud-core-outer" cx="20" cy="20" r="18.5" fill="none" stroke-width="0.75"></circle>
            <circle class="hud-core-ring" cx="20" cy="20" r="16" fill="none" stroke-width="2"></circle>
            <circle class="hud-core-dot" cx="20" cy="20" r="4"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Friday</h1>
          <div class="hud-status-row">
            <span id="hudStatus" class="hud-status">待命中</span>
            <span class="hud-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="voiceToggleBtn" class="icon-btn" title="語音回覆" aria-label="語音回覆開關">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="設定" aria-label="設定">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 對話區域 -->
    <main id="messages" class="messages">
      <div class="message assistant">
        <div class="bubble">嗨,我是 Friday 👋 有什麼我可以幫你的嗎?</div>
      </div>
    </main>

    <!-- 輸入區 -->
    <footer class="composer">
      <button id="micBtn" class="mic-btn" title="語音輸入" aria-label="語音輸入">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <div class="input-frame">
        <textarea id="input" class="input" rows="1"
                  placeholder="輸入訊息…(Enter 送出,Shift+Enter 換行)"></textarea>
      </div>
      <button id="sendBtn" class="send-btn" title="送出" aria-label="送出">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
  </div>

  <!-- 設定對話框 -->
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="settingsTitle">設定</h2>
        <button class="icon-btn" data-close aria-label="關閉">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <label class="field-label" for="apiKey">Gemini API 金鑰</label>
      <input id="apiKey" class="field-input" type="password"
             placeholder="貼上你的 API 金鑰" autocomplete="off" />
      <p class="field-hint">金鑰只會儲存在你的瀏覽器本機(localStorage),不會上傳到任何伺服器。</p>
      <div class="modal-actions">
        <span id="settingsStatus" class="status"></span>
        <button id="saveKeyBtn" class="primary-btn">儲存</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=7"></script>
</body>
</html>
